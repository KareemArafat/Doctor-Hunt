name: doctor_hunt
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  intl: ^0.20.3
  google_fonts: ^8.2.1
  go_router: ^18.0.1
  slang: ^4.19.0
  slang_flutter: ^4.19.0
  pinput: ^6.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  go_router_builder: ^4.5.0
  slang_build_runner: ^4.19.0




flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_assets:
  assets_path: assets/
  output_path: lib/generated/
  filename: app_images.dart
  classname: AppImages
  ignore_comments: true


